<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移転しました｜farst サポート</title>
<meta http-equiv="refresh" content="0; url=https://farst.me/support/">
<link rel="canonical" href="https://farst.me/support/">
<meta name="description" content="farst のサポートは https://farst.me/support/ へ移転しました。">
<style>
  :root { --bg: #F4F1EA; --sage: #4A7660; --ink: #26221E; --muted: #6b6359; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-content: center; text-align: center;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    line-height: 1.85; padding: 40px 24px;
  }
  .mark {
    width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 20px;
    background: var(--sage); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: .02em; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  a.go {
    display: inline-block; padding: 12px 24px; border-radius: 999px;
    background: var(--sage); color: var(--bg); text-decoration: none; font-size: 14px;
  }
</style>
</head>
<body>
  <div>
    <div class="mark">F</div>
    <h1>farst のサポートは移転しました</h1>
    <p>自動で移動します。切り替わらない場合は下のリンクからどうぞ。</p>
    <a class="go" href="https://farst.me/support/">https://farst.me/support/</a>
  </div>
</body>
</html>
